# Default values for git-sync-webserver.
# This is a YAML-formatted file.

replicaCount: 1

imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Git repository to fetch the content from.
git:
  repository: https://github.com/cloudsoft/hello-world-html
  depth: 1
  syncPeriod: 1h
  username: ""
  token: ""
  # Existing secret containing a `token` key
  existingSecret: ""
  # See https://github.com/kubernetes/git-sync/
  extraArgs: []


# Configuration for webserver container.
webserver:

  # Webserver type. Can be one of: "static"
  type: static
  port: 8080
  # Root path within the git repository
  path: /

  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Per webserver type configuration.
  types:

    static:
      image:
        repository: ghcr.io/static-web-server/static-web-server
        tag: "2.44-alpine"
      # See https://static-web-server.net/v3/configuration/cli.html for more options
      args: ['--port=8080', '--root=/data', '--log-level=info', '--log-remote-address=true']

    python:
      image:
        repository: python
        tag: 3.12-slim-trixie
      # Gunicorn configuration
      gunicorn:
        module: 'main:app'
        workers: 2

    custom:
      image:
        repository: <custom image repository>
        tag: <custom image tag>
      containerPort: 8080
      mountPath: /data
      # command:
      #   - custom
      #   - command
      # args:
      #   - custom
      #   - args

# Configuration for git-sync container.
gitSync:
  image:
    repository: registry.k8s.io/git-sync/git-sync
    pullPolicy: IfNotPresent
    tag: v4.7.1

  port: 8080

  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  livenessProbe:
    httpGet:
      path: /
      port: gitsync
  readinessProbe:
    httpGet:
      path: /
      port: gitsync

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

# Global pod settings
podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

persistence:
  enabled: false
  accessMode: ReadWriteOnce
  # storageClass: null
  # additionalLabels: {}
  # annotations: {}
  storageSize: 8Gi
  mountPoint: /persistence

# Additional volumes on the output Deployment definition.
extraVolumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
extraVolumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
