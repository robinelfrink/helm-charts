{{- if .Values.persistence.enabled }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "git-sync-webserver.fullname" . }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "git-sync-webserver.labels" . | nindent 4 }}
    {{- with .Values.persistence.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.storageSize | quote }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  volumeMode: {{ .Values.persistence.volumeMode }}
{{- end }}