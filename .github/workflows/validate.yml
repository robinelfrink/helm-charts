name: Validate Charts

on:
  pull_request:
    branches: ['main']
    paths:
      - 'charts/**'
      - '.github/workflows/chart-*.yml'
  workflow_dispatch:

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          allowed-commit-types: "chore,docs,feat,fix,test"

  charts:
    runs-on: ubuntu-latest
    needs: conventional-commits
    outputs:
      charts: ${{ steps.charts.outputs.charts }}
      ct_all: ${{ steps.charts.outputs.ct_all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2
      - name: List charts to validate
        id: charts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "charts=$(ct list-changed)" >> "$GITHUB_OUTPUT"
            echo "ct_all=" >> "$GITHUB_OUTPUT"
          else
            echo "charts=$(find charts/ -maxdepth 1 -mindepth 1 -type d)" >> "$GITHUB_OUTPUT"
            echo "ct_all=--all" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    needs: charts
    if: ${{ needs.charts.outputs.charts != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2
      - name: Lint charts
        run: |
          for CHART in "${{ needs.charts.outputs.charts }}"; do
            echo "Linting ${CHART}"
            helm lint "${CHART}"
          done
          ct lint ${{ needs.charts.outputs.ct_all }} --check-version-increment=false --validate-maintainers=false
  template:
    runs-on: ubuntu-latest
    if: ${{ needs.charts.outputs.charts != '' }}
    needs: charts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Template with default values
        run: |
          for CHART in "${{ needs.charts.outputs.charts }}"; do
            echo "Testing ${CHART} with defaults"
            helm template test "${CHART}"
          done
  install:
    runs-on: ubuntu-latest
    if: ${{ needs.charts.outputs.charts != '' }}
    needs:
      - charts
      - lint
      - template
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2
      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: chart-testing
      - name: Install charts
        run: ct install ${{ needs.charts.outputs.ct_all }}